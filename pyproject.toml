[project]
name = "ragdex-api"
version = "1.0.0"
description = "FastAPI backend for the RagDex trading journal"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # [email] because the auth schemas validate addresses with EmailStr, and
    # rejecting a malformed one here is cheaper than a round trip to Identity
    # Toolkit to be told the same thing.
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "firebase-admin>=6.5",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    # AES-GCM for application-level encryption; see app/core/crypto.py.
    "cryptography>=43.0",
    # Reading the dozen date shapes a broker might export, in
    # app/services/csv_analyse.py. The only part of that module the standard
    # library cannot do: strptime needs to be told the format, and the whole
    # point there is not knowing it.
    #
    # pandas would also do this, and was tried. It brings numpy and about
    # ninety megabytes resident, on an instance with five hundred — for a
    # median and some date parsing, after the client had already settled the
    # delimiter. This is the same capability at a thousandth of the size.
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-requests",
]

[tool.ruff]
line-length = 90
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle, pyflakes
    "I",                # import order
    "B",                # bugbear
    "S",                # bandit: security
    "UP",               # pyupgrade
    "ASYNC",            # async correctness
    "SIM",              # simplification
    "RUF",
]
# S101 (assert) is the point of a test file; the rest only make sense in
# application code.
ignore = ["B008"]  # FastAPI's Depends() in defaults is the documented idiom.

[tool.ruff.lint.per-file-ignores]
# S101 (assert) is the point of a test file. S105/S106 flag the literal
# passwords a sign-in test has to contain to be a sign-in test.
"tests/*" = ["S101", "S105", "S106"]
# Email markup. Every line is a table cell with inline styles, because that is
# the only thing Gmail, Outlook and Apple Mail all render the same way — and
# wrapping one would change what is sent.
"app/services/email_template.py" = ["E501"]
# Seed data. S311 flags random for cryptographic use; this generates fake
# trades, where reproducibility is the requirement and secrecy is not one.
"scripts/*" = ["S311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = []
# The Firebase and Google client libraries ship no usable stubs.
[[tool.mypy.overrides]]
module = ["firebase_admin.*", "google.cloud.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
