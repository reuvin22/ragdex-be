[project]
name = "ragdex-api"
version = "1.0.0"
description = "FastAPI backend for the RagDex trading journal"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "firebase-admin>=6.5",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-requests",
]

[tool.ruff]
line-length = 90
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle, pyflakes
    "I",                # import order
    "B",                # bugbear
    "S",                # bandit: security
    "UP",               # pyupgrade
    "ASYNC",            # async correctness
    "SIM",              # simplification
    "RUF",
]
# S101 (assert) is the point of a test file; the rest only make sense in
# application code.
ignore = ["B008"]  # FastAPI's Depends() in defaults is the documented idiom.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = []
# The Firebase and Google client libraries ship no usable stubs.
[[tool.mypy.overrides]]
module = ["firebase_admin.*", "google.cloud.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
