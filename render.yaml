# Render Blueprint. Point Render at this repository (New > Blueprint) and it
# creates the service described here; the values marked `sync: false` are left
# blank for you to fill in the dashboard, because they are secrets or depend on
# where the front end ended up.
#
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: ragdex-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # /health, not /ready. Readiness returns 503 when Firestore is briefly
    # unreachable, which is the correct answer to "should you send me traffic"
    # and the wrong one to "is this instance alive" — Render restarts on a
    # failing health check, and restarting does not fix Firestore.
    healthCheckPath: /health

    autoDeployTrigger: commit

    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"

      # The host allowlist TrustedHostMiddleware enforces. Correct the first
      # entry if Render appended a suffix to the service name; the wildcard
      # covers that case and the PR preview hosts, and localhost is here for
      # the platform's own health check, which does not arrive over the public
      # hostname. If a deploy is ever marked unhealthy with 400s in the log,
      # this is the line that did it.
      - key: ALLOWED_HOSTS
        value: ragdex-be.onrender.com,*.onrender.com,localhost,127.0.0.1

      # The web app's exact origin(s), comma-separated, scheme included —
      # e.g. https://ragdex.vercel.app. No wildcards: these requests carry
      # credentials, and browsers reject a wildcard origin on those anyway.
      - key: CORS_ORIGINS
        sync: false

      # Firebase credentials. PREFER a Secret File over this variable:
      # Dashboard > Secret Files > add trading-journal.json. Render mounts it
      # at /etc/secrets/trading-journal.json and the app finds it there with
      # no configuration (see SERVICE_ACCOUNT_PATHS in app/core/config.py).
      #
      # A multi-kilobyte private key pasted into an env var is easy to
      # truncate and easy to mangle by losing its newline escapes. Set this
      # only if you cannot use a Secret File; leave it unset otherwise.
      #
      # Render has no Application Default Credentials, so one of the two is
      # required: without either, startup now fails loudly rather than
      # serving a healthy-looking service whose every Firebase call errors.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false

      # Powers the coach and the behavioural leak card. Without these, those
      # two routes are the only thing that stops working.
      - key: OPENROUTER_API_KEY
        sync: false
      # A chain, not one slug. configured_models() splits this on commas and
      # hands the whole list to OpenRouter, which falls through when a model is
      # rate limited or unavailable. A single slug throws that away and leaves
      # the coach with no second chance — which is how a 402 became a dead end
      # rather than a degraded answer.
      #
      # Ids are namespaced by provider: "openai/gpt-4o-mini", never the bare
      # "gpt-4o-mini" you would send to OpenAI directly. An unnamespaced slug is
      # rejected before any model is reached.
      #
      # Free models here so this works on an account with no credit. Adding a
      # paid one is worthwhile — build_system_prompt() sends the whole playbook
      # plus the full stats JSON on EVERY message, so quality shows — but put it
      # first and leave the free ones trailing, so running out of credit
      # degrades the coach instead of breaking it.
      - key: OPENROUTER_MODEL
        value: nex-agi/nex-n2.5-mini:free,nex-agi/nex-n2.5-pro:free

      # ---------------------------------------------------------------- auth
      #
      # The origin a browser uses to reach this API, which is the WEB APP's
      # origin — not this service's Render hostname. /api is proxied there by
      # the rewrite in the client's vercel.json.
      #
      # Counter-intuitive, and load-bearing. It builds the Google redirect
      # URI, and that callback arrives as a navigation: whichever origin it
      # lands on is the origin the session cookie is scoped to. Set this to
      # the Render hostname and the cookie lands on a site the app is not
      # served from, so sign-in completes and then does not stick — with
      # nothing in any log to say why.
      #
      # Same value as APP_URL. Both are set separately because they answer
      # different questions and could diverge behind a different proxy setup.
      - key: API_PUBLIC_URL
        sync: false

      # Where the browser is sent after sign-in, and the base for links inside
      # emails. The web app's origin, e.g. https://ragdex.vercel.app — get
      # this wrong and a successful sign-in bounces the user somewhere else.
      - key: APP_URL
        sync: false

      # Firebase Console > Project settings > General > Web API Key. The Admin
      # SDK can mint and verify tokens but cannot check a password, so every
      # email/password sign-in goes through Identity Toolkit with this.
      # Without it, password sign-in answers 501 not_configured.
      - key: FIREBASE_WEB_API_KEY
        sync: false

      # Google Cloud console > APIs & Services > Credentials > OAuth 2.0
      # Client ID (Web application) — not the Firebase console; this is a
      # different credential. Its authorised redirect URI must be exactly
      # API_PUBLIC_URL + /api/v1/auth/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # The session cookie. Secure must stay true here: it is only ever turned
      # off for plain-HTTP local development, and a Secure cookie over http is
      # silently never sent — sign-in appears to work and the session does not
      # stick.
      - key: SESSION_COOKIE_SECURE
        value: "true"
      # Lax is correct while the app reaches this service through the rewrite
      # in the client's vercel.json, which makes them same-site. Genuinely
      # cross-site needs "none", and then Safari's third-party cookie blocking
      # applies and sign-in stops working for those users.
      - key: SESSION_COOKIE_SAMESITE
        value: lax
      - key: SESSION_DAYS
        value: "5"

      # Brevo sends the branded verification email. The key can send mail as
      # you — treat it as a password. Without these, /auth/verify-email is the
      # only thing that stops working.
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: RagDex

      # Limits. The rate limiter is in-process, so these are per instance —
      # which is exact at one instance and approximate the moment you scale.
      # More than one replica means moving the limiter to Redis.
      - key: MAX_REQUEST_BYTES
        value: "262144"
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: COACH_RATE_LIMIT_PER_MINUTE
        value: "12"
